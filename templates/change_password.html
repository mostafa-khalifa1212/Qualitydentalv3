{% extends "base.html" %}{% block title %}تغيير كلمة المرور · Quality Dental{% endblock %}{% block content %}
<section class="auth-wrap"><div class="panel auth-card"><div class="auth-logo">🔑</div><p class="eyebrow">حماية الحساب</p><h1>تغيير كلمة المرور</h1><p class="muted">على الأقل {{ min_len }} أحرف، ولا تحتوي على اسم المستخدم. تغيير كلمة المرور يسجّل خروج أجهزتك الأخرى.</p>
<form method="post" class="form" autocomplete="off"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>كلمة المرور الحالية<input id="pw-current" name="current_password" type="password" required autocomplete="current-password"></label>
<label>كلمة المرور الجديدة<input id="pw-new" name="new_password" type="password" required minlength="{{ min_len }}" autocomplete="new-password"></label>
<label>تأكيد كلمة المرور الجديدة<input id="pw-confirm" name="confirm_password" type="password" required minlength="{{ min_len }}" autocomplete="new-password"></label>
<button class="btn" id="pw-submit" type="submit">حفظ كلمة المرور</button></form></div></section>
{% endblock %}
